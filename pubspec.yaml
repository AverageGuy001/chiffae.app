name: chifaae
description: "Chifaae – Moroccan Healthcare MVP"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  flutter_dotenv: ^5.2.1
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  http: ^1.5.0
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1
  record: ^5.2.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/
    - .env